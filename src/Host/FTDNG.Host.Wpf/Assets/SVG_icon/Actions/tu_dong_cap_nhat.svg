        <rect x="124" y="73" width="4" height="5" fill="#000000" rx="2"/>
        <!-- 3 Gantt Task bars in waterfall formation -->
          <rect x="2" y="34" width="32" height="16" fill="#3b82f6" stroke="#000000" stroke-width="2" rx="2" stroke-linejoin="round"/>
          <rect x="36" y="58" width="50" height="16" fill="#3b82f6" stroke="#000000" stroke-width="2" rx="2" stroke-linejoin="round"/>
