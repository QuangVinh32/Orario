<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
        <path id="backFlap" d="M 16 104 L 16 32 A 4 4 0 0 1 20 28 L 48 28 L 64 48 L 112 48 A 4 4 0 0 1 116 52 L 116 104 Z" />
        <rect id="paperDoc" x="28" y="36" width="72" height="60" rx="2" />
        <polygon id="frontFlap" points="44,72 124,72 116,104 16,104" />
    </defs>

    <!-- SILHOUETTE BLOB: Nền đen đặc khổng lồ chêm dưới cùng, lồi ra ngoài 2px để làm viền bao ngoài -->
    <g fill="#000000" stroke="#000000" stroke-width="4" stroke-linejoin="round">
        <use href="#backFlap"/>
        <use href="#paperDoc"/>
        <use href="#frontFlap"/>
    </g>

    <!-- CÁC LỚP CHI TIẾT TRÊN CÙNG: Dùng viền 1px để phân định ranh giới bên trong -->
    <!-- Back Cover -->
    <use href="#backFlap" fill="#eab308" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
    
    <!-- Paper Document -->
    <use href="#paperDoc" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
    <!-- Dòng kẻ trên giấy (Xám) -->
    <line x1="40" y1="52" x2="64" y2="52" stroke="#d1d5db" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="64" x2="88" y2="64" stroke="#d1d5db" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="76" x2="88" y2="76" stroke="#d1d5db" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Front Flap -->
    <use href="#frontFlap" fill="#facc15" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
</svg>