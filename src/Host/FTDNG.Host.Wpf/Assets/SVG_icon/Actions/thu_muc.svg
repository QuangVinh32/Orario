<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
        <path id="backTab" d="M 16 48 L 16 32 A 4 4 0 0 1 20 28 L 48 28 L 64 48 Z" />
        <rect id="frontFlap" x="12" y="48" width="104" height="60" rx="4" />
    </defs>

    <!-- SILHOUETTE BLOB (Viền ngoài 2px) -->
    <g fill="#000000" stroke="#000000" stroke-width="4" stroke-linejoin="round">
        <use href="#backTab"/>
        <use href="#frontFlap"/>
    </g>

    <!-- CHI TIẾT TRONG (Viền 1px) -->
    <use href="#backTab" fill="#eab308" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
    
    <use href="#frontFlap" fill="#facc15" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
    
    <!-- Crease (Giảm còn 1px để thanh thoát hơn) -->
    <line x1="14" y1="56" x2="114" y2="56" stroke="#ca8a04" stroke-width="1"/>
</svg>